<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Rolling without slipping velocity map</title>
  <desc id="desc">A rolling wheel with top, center, and contact-point velocities.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <line x1="60" y1="350" x2="840" y2="350" stroke="#64748b" stroke-width="6"/>
  <circle cx="360" cy="220" r="130" fill="#eef2ff" stroke="#4f46e5" stroke-width="6"/>
  <circle cx="360" cy="220" r="8" fill="#4f46e5"/>
  <path d="M405 106 A118 118 0 0 1 474 205" fill="none" stroke="#4f46e5" stroke-width="6"/>
  <path d="M474 205 l-18-18 l-5 25" fill="#4f46e5"/>
  <g stroke="#0891b2" stroke-width="6" fill="#0891b2">
    <line x1="360" y1="90" x2="650" y2="90"/><path d="M650 90 l-24-12 v24 z"/>
    <line x1="360" y1="220" x2="505" y2="220"/><path d="M505 220 l-24-12 v24 z"/>
  </g>
  <circle cx="360" cy="350" r="10" fill="#f59e0b"/>
  <g font-family="Arial, sans-serif" font-size="27" fill="#334155">
    <text x="510" y="77" fill="#0e7490">2v_cm</text>
    <text x="427" y="207" fill="#0e7490">v_cm</text>
    <text x="390" y="385" fill="#b45309">contact point: v = 0</text>
    <text x="590" y="280">no slip: v_cm = Rω</text>
    <text x="590" y="320">K = ½Mv_cm² + ½I_cmω²</text>
  </g>
</svg>
