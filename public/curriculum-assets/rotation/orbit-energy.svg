<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Elliptical orbit and energy changes</title>
  <desc id="desc">An elliptical orbit with periapsis and apoapsis, plus kinetic and potential energy bars.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <ellipse cx="330" cy="215" rx="250" ry="135" fill="none" stroke="#155E75" stroke-width="6"/>
  <circle cx="200" cy="215" r="34" fill="#fbbf24" stroke="#b45309" stroke-width="5"/>
  <circle cx="90" cy="215" r="15" fill="#0891b2"/>
  <circle cx="580" cy="215" r="15" fill="#0891b2"/>
  <line x1="90" y1="215" x2="90" y2="110" stroke="#0891b2" stroke-width="7"/>
  <path d="M90 110 l-12 24 h24 z" fill="#0891b2"/>
  <line x1="580" y1="215" x2="580" y2="170" stroke="#0891b2" stroke-width="7"/>
  <path d="M580 170 l-12 24 h24 z" fill="#0891b2"/>
  <g font-family="Arial, sans-serif" fill="#334155">
    <text x="65" y="255" font-size="24">periapsis</text>
    <text x="535" y="255" font-size="24">apoapsis</text>
    <text x="48" y="90" font-size="24" fill="#0e7490">faster</text>
    <text x="545" y="150" font-size="24" fill="#0e7490">slower</text>
    <text x="655" y="85" font-size="25">E = constant</text>
    <rect x="680" y="120" width="70" height="180" rx="6" fill="#155E75" opacity=".85"/>
    <rect x="775" y="205" width="70" height="95" rx="6" fill="#0891b2" opacity=".85"/>
    <text x="696" y="330" font-size="23">K</text>
    <text x="792" y="330" font-size="23">U</text>
    <text x="650" y="375" font-size="24">K and U exchange</text>
  </g>
</svg>
