<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Rolling down an incline: energy split</title>
  <desc id="desc">A disk rolling without slipping down an incline with an energy bar chart splitting lost potential energy into translational and rotational kinetic energy.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <path d="M60 360 L440 360 L60 120 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <circle cx="255" cy="222" r="34" fill="#EDF8FB" stroke="#155E75" stroke-width="5"/>
  <circle cx="255" cy="222" r="7" fill="#155E75"/>
  <line x1="255" y1="222" x2="297" y2="207" stroke="#155E75" stroke-width="4"/>
  <path d="M310 190 l34 -13" stroke="#0891b2" stroke-width="7" fill="none"/>
  <path d="M344 177 l-22 2 l8 18 Z" fill="#0891b2"/>
  <text x="356" y="182" font-family="Arial, sans-serif" font-size="24" fill="#0e7490">v_cm</text>
  <path d="M282 248 A40 40 0 0 1 224 258" fill="none" stroke="#b45309" stroke-width="4"/>
  <path d="M224 258 l14 -2 l-6 -13 Z" fill="#b45309"/>
  <text x="240" y="300" font-family="Arial, sans-serif" font-size="24" fill="#92400e">ω</text>
  <text x="330" y="330" font-family="Arial, sans-serif" font-size="23" fill="#475569">no slip: contact point at rest</text>
  <text x="520" y="70" font-family="Arial, sans-serif" font-size="25" fill="#334155">lost U_g splits into two kinetic stores</text>
  <rect x="540" y="110" width="320" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <text x="560" y="144" font-family="Arial, sans-serif" font-size="24" fill="#334155">U_g lost = Mgh</text>
  <rect x="540" y="190" width="196" height="52" fill="#DCEFF5" stroke="#155E75" stroke-width="3"/>
  <text x="556" y="224" font-family="Arial, sans-serif" font-size="22" fill="#1e1b4b">½Mv_cm² translation</text>
  <rect x="540" y="268" width="124" height="52" fill="#fcd34d" stroke="#b45309" stroke-width="3"/>
  <text x="552" y="302" font-family="Arial, sans-serif" font-size="22" fill="#78350f">½Iω² rotation</text>
  <text x="540" y="370" font-family="Arial, sans-serif" font-size="23" fill="#334155">larger I ⇒ smaller v_cm at the bottom</text>
</svg>
