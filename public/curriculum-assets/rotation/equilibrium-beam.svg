<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Rotational equilibrium of a supported beam</title>
  <desc id="desc">A beam on two supports carrying a load; forces are drawn at their application points and torques are taken about one support.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <rect x="80" y="200" width="740" height="26" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <path d="M180 226 L150 288 L210 288 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <path d="M700 226 L670 288 L730 288 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <rect x="410" y="150" width="80" height="50" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="422" y="182" font-family="Arial, sans-serif" font-size="22" fill="#92400e">load</text>
  <line x1="180" y1="200" x2="180" y2="112" stroke="#4f46e5" stroke-width="7"/>
  <path d="M180 112 l-10 22 h20 Z" fill="#4f46e5"/>
  <text x="122" y="106" font-family="Arial, sans-serif" font-size="25" fill="#312e81">F₁</text>
  <line x1="700" y1="200" x2="700" y2="112" stroke="#4f46e5" stroke-width="7"/>
  <path d="M700 112 l-10 22 h20 Z" fill="#4f46e5"/>
  <text x="712" y="106" font-family="Arial, sans-serif" font-size="25" fill="#312e81">F₂</text>
  <line x1="450" y1="226" x2="450" y2="308" stroke="#dc2626" stroke-width="6"/>
  <path d="M450 308 l-9 -20 h18 Z" fill="#dc2626"/>
  <text x="462" y="292" font-family="Arial, sans-serif" font-size="25" fill="#b91c1c">mg</text>
  <line x1="180" y1="345" x2="450" y2="345" stroke="#0891b2" stroke-width="4"/>
  <path d="M180 345 l16 -7 v14 Z" fill="#0891b2"/>
  <path d="M450 345 l-16 -7 v14 Z" fill="#0891b2"/>
  <text x="278" y="377" font-family="Arial, sans-serif" font-size="24" fill="#0e7490">r₁</text>
  <line x1="450" y1="345" x2="700" y2="345" stroke="#0891b2" stroke-width="4"/>
  <path d="M700 345 l-16 -7 v14 Z" fill="#0891b2"/>
  <text x="560" y="377" font-family="Arial, sans-serif" font-size="24" fill="#0e7490">r₂</text>
  <circle cx="180" cy="213" r="7" fill="#4f46e5"/>
  <text x="92" y="260" font-family="Arial, sans-serif" font-size="23" fill="#475569">pivot choice</text>
  <text x="150" y="404" font-family="Arial, sans-serif" font-size="24" fill="#334155">ΣF = 0 and Στ = 0 about the same pivot, forces drawn at application points</text>
</svg>
