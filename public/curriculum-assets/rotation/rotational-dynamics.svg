<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Translation and rotation of a falling yo-yo</title>
  <desc id="desc">A falling yo-yo with tension, weight, linear acceleration, angular acceleration, and axle radius.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <line x1="210" y1="25" x2="210" y2="208" stroke="#64748b" stroke-width="8"/>
  <circle cx="300" cy="250" r="105" fill="#EDF8FB" stroke="#155E75" stroke-width="6"/>
  <circle cx="300" cy="250" r="34" fill="#ffffff" stroke="#155E75" stroke-width="6"/>
  <line x1="210" y1="208" x2="273" y2="218" stroke="#64748b" stroke-width="8"/>
  <line x1="273" y1="218" x2="273" y2="90" stroke="#0891b2" stroke-width="6"/>
  <path d="M273 90 l-11 25 h22 z" fill="#0891b2"/>
  <line x1="300" y1="250" x2="300" y2="385" stroke="#f59e0b" stroke-width="6"/>
  <path d="M300 385 l-11-25 h22 z" fill="#f59e0b"/>
  <path d="M352 178 A86 86 0 0 1 384 259" fill="none" stroke="#155E75" stroke-width="6"/>
  <path d="M384 259 l-18-18 l-5 25" fill="#155E75"/>
  <g font-family="Arial, sans-serif" font-size="27" fill="#334155">
    <text x="233" y="85" fill="#0e7490">T</text>
    <text x="316" y="388" fill="#b45309">Mg, a_cm</text>
    <text x="395" y="227" fill="#312e81">α</text>
    <text x="500" y="160">translation: ΣF = Ma_cm</text>
    <text x="500" y="225">rotation: Στ = Iα</text>
    <text x="500" y="290">constraint: a_cm = rα</text>
  </g>
</svg>
