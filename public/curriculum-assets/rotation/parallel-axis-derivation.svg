<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Parallel-axis theorem derivation geometry</title>
  <desc id="desc">Top view: center-of-mass axis, a parallel axis at distance d, and a mass element dm with distance vectors r and r-prime.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <circle cx="330" cy="280" r="11" fill="#4f46e5"/>
  <circle cx="330" cy="280" r="26" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <text x="268" y="345" font-family="Arial, sans-serif" font-size="24" fill="#312e81">CM axis (top view)</text>
  <circle cx="620" cy="280" r="11" fill="#b45309"/>
  <circle cx="620" cy="280" r="26" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="572" y="345" font-family="Arial, sans-serif" font-size="24" fill="#92400e">new axis</text>
  <line x1="330" y1="312" x2="620" y2="312" stroke="#0891b2" stroke-width="4"/>
  <path d="M330 312 l17 -7 v14 Z" fill="#0891b2"/>
  <path d="M620 312 l-17 -7 v14 Z" fill="#0891b2"/>
  <text x="462" y="342" font-family="Arial, sans-serif" font-size="25" fill="#0e7490">d</text>
  <circle cx="430" cy="120" r="9" fill="#64748b"/>
  <text x="443" y="112" font-family="Arial, sans-serif" font-size="24" fill="#475569">dm</text>
  <line x1="330" y1="280" x2="430" y2="120" stroke="#4f46e5" stroke-width="5"/>
  <path d="M430 120 l-24 10 l16 14 Z" fill="#4f46e5"/>
  <text x="352" y="185" font-family="Arial, sans-serif" font-size="25" fill="#312e81">r</text>
  <line x1="620" y1="280" x2="430" y2="120" stroke="#b45309" stroke-width="5" stroke-dasharray="12 8"/>
  <path d="M430 120 l12 22 l16 -12 Z" fill="#b45309"/>
  <text x="548" y="185" font-family="Arial, sans-serif" font-size="25" fill="#92400e">r′</text>
  <line x1="430" y1="120" x2="430" y2="280" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="438" y="235" font-family="Arial, sans-serif" font-size="23" fill="#64748b">x</text>
  <text x="96" y="70" font-family="Arial, sans-serif" font-size="25" fill="#334155">r′² = (x − d)² + y² = r² − 2dx + d²</text>
  <text x="96" y="404" font-family="Arial, sans-serif" font-size="24" fill="#334155">∫ x dm = M·x_cm = 0, because the origin is the center of mass</text>
</svg>
