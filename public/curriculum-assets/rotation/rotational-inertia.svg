<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Mass distribution and rotational inertia</title>
  <desc id="desc">A solid disk and a hoop of equal mass and radius, showing different mass distributions.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="265" cy="190" r="125" fill="#DCEFF5" stroke="#155E75" stroke-width="6"/>
    <circle cx="265" cy="190" r="8" fill="#312e81"/>
    <line x1="265" y1="190" x2="390" y2="190" stroke="#0891b2" stroke-width="4"/>
    <text x="327" y="178" font-size="26" fill="#0e7490">R</text>
    <text x="265" y="350" font-size="28" fill="#334155">solid disk</text>
    <text x="265" y="386" font-size="28" fill="#312e81">I = ½MR²</text>
    <circle cx="650" cy="190" r="125" fill="none" stroke="#155E75" stroke-width="28"/>
    <circle cx="650" cy="190" r="8" fill="#312e81"/>
    <line x1="650" y1="190" x2="775" y2="190" stroke="#0891b2" stroke-width="4"/>
    <text x="712" y="178" font-size="26" fill="#0e7490">R</text>
    <text x="650" y="350" font-size="28" fill="#334155">thin hoop</text>
    <text x="650" y="386" font-size="28" fill="#312e81">I = MR²</text>
    <text x="450" y="42" font-size="27" fill="#475569">same M, same R, different mass distribution</text>
  </g>
</svg>
