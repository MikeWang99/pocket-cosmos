<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Torque graph areas: work versus angular impulse</title>
  <desc id="desc">Two graphs: torque versus angular position whose area is work, and torque versus time whose area is angular impulse.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <line x1="70" y1="330" x2="410" y2="330" stroke="#64748b" stroke-width="3"/>
  <line x1="70" y1="330" x2="70" y2="70" stroke="#64748b" stroke-width="3"/>
  <path d="M70 330 L70 170 L200 170 L330 240 L330 330 Z" fill="#a5b4fc" opacity="0.55"/>
  <polyline points="70,170 200,170 330,240" fill="none" stroke="#4f46e5" stroke-width="5"/>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="24" fill="#312e81">area = W</text>
  <text x="96" y="60" font-family="Arial, sans-serif" font-size="24" fill="#312e81">τ</text>
  <text x="392" y="364" font-family="Arial, sans-serif" font-size="24" fill="#312e81">θ</text>
  <text x="96" y="396" font-family="Arial, sans-serif" font-size="25" fill="#334155">W = ∫ τ dθ</text>
  <line x1="500" y1="330" x2="850" y2="330" stroke="#64748b" stroke-width="3"/>
  <line x1="500" y1="330" x2="500" y2="70" stroke="#64748b" stroke-width="3"/>
  <path d="M500 330 L500 150 L640 110 L770 210 L770 330 Z" fill="#fcd34d" opacity="0.6"/>
  <polyline points="500,150 640,110 770,210" fill="none" stroke="#b45309" stroke-width="5"/>
  <text x="580" y="280" font-family="Arial, sans-serif" font-size="24" fill="#92400e">area = ΔL</text>
  <text x="526" y="60" font-family="Arial, sans-serif" font-size="24" fill="#92400e">τ</text>
  <text x="826" y="364" font-family="Arial, sans-serif" font-size="24" fill="#92400e">t</text>
  <text x="526" y="396" font-family="Arial, sans-serif" font-size="25" fill="#334155">ΔL = ∫ τ dt</text>
  <text x="230" y="30" font-family="Arial, sans-serif" font-size="25" fill="#312e81">energy transfer</text>
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="25" fill="#92400e">momentum transfer</text>
</svg>
