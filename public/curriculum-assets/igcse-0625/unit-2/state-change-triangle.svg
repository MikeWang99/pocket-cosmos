  <text x="689" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#176B86">sublimation</text>
  <rect x="626" y="470" width="154" height="44" rx="22" fill="#F1F5F7" stroke="#CBD7DD" stroke-width="2"/>
  <text x="703" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5E7682">deposition</text>

  <path d="M292 732H708" stroke="#176B86" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHeat)"/>
  <path d="M708 788H292" stroke="#6C8592" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowCool)"/>

