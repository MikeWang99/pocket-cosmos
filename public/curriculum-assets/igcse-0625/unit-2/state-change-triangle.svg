    </marker>
  </defs>

  <text x="500" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0F2F3A">State changes</text>

  <circle cx="500" cy="180" r="78" fill="#E8F7FB" stroke="#176B86" stroke-width="6"/>
  <circle cx="205" cy="760" r="78" fill="#E8F7FB" stroke="#176B86" stroke-width="6"/>
  <circle cx="795" cy="760" r="78" fill="#E8F7FB" stroke="#176B86" stroke-width="6"/>

  <text x="500" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0F2F3A">Solid</text>
  <text x="205" y="774" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0F2F3A">Liquid</text>
  <text x="795" y="774" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0F2F3A">Gas</text>

  <path d="M445 260C374 398 304 536 234 674" stroke="#176B86" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHeat)"/>
  <path d="M260 680C332 540 404 400 476 258" stroke="#6C8592" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowCool)"/>

