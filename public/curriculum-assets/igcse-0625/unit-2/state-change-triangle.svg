  <text x="312" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#176B86">melting</text>
  <rect x="356" y="370" width="134" height="44" rx="22" fill="#F1F5F7" stroke="#CBD7DD" stroke-width="2"/>
  <text x="423" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5E7682">freezing</text>

  <path d="M555 260C626 398 696 536 766 674" stroke="#176B86" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHeat)"/>
  <path d="M740 680C668 540 596 400 524 258" stroke="#6C8592" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowCool)"/>

