<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Thermal expansion comparison</title>
  <desc id="desc">A comparison chart showing different materials expanding by different amounts for the same temperature rise.</desc>
  <rect width="900" height="620" rx="32" fill="#f6fbfd"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="450" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#123444">Thermal expansion differs by material</text>
    <text x="90" y="112" font-size="22" fill="#526879">Same original length and same temperature rise</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">
    <g transform="translate(90,145)">
      <text x="0" y="34" fill="#123444">invar</text>
      <rect x="190" y="8" width="60" height="36" rx="8" fill="#bfe8ee" stroke="#0f6f86" stroke-width="3"/>
      <text x="285" y="35" fill="#526879">small</text>
    </g>
    <g transform="translate(90,215)">
      <text x="0" y="34" fill="#123444">glass</text>
      <rect x="190" y="8" width="170" height="36" rx="8" fill="#bfe8ee" stroke="#0f6f86" stroke-width="3"/>
      <text x="395" y="35" fill="#526879">medium</text>
    </g>
    <g transform="translate(90,285)">
      <text x="0" y="34" fill="#123444">steel</text>
      <rect x="190" y="8" width="210" height="36" rx="8" fill="#bfe8ee" stroke="#0f6f86" stroke-width="3"/>
      <text x="435" y="35" fill="#526879">medium</text>
    </g>
    <g transform="translate(90,355)">
      <text x="0" y="34" fill="#123444">brass</text>
      <rect x="190" y="8" width="320" height="36" rx="8" fill="#bfe8ee" stroke="#0f6f86" stroke-width="3"/>
      <text x="545" y="35" fill="#526879">large</text>
    </g>
    <g transform="translate(90,425)">
      <text x="0" y="34" fill="#123444">aluminium</text>
      <rect x="190" y="8" width="400" height="36" rx="8" fill="#bfe8ee" stroke="#0f6f86" stroke-width="3"/>
      <text x="625" y="35" fill="#526879">largest</text>
    </g>
  </g>
  <g stroke="#8ba0aa" stroke-width="4" stroke-linecap="round">
    <path d="M280 525 H705"/>
    <path d="M280 512 V538 M492 512 V538 M705 512 V538"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#526879" font-size="20" font-weight="700">
    <text x="280" y="570" text-anchor="middle">less expansion</text>
    <text x="705" y="570" text-anchor="middle">more expansion</text>
  </g>
</svg>
