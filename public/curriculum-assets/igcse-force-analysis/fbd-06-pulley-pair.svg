<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Reference free-body diagrams: two masses joined over a pulley</title>
  <desc id="desc">A 3.0 kg mass and a 2.0 kg mass joined by a light string over a pulley. Each mass has weight down and tension up; the 3.0 kg side has weight longer than tension, the 2.0 kg side has tension longer than weight.</desc>
  <defs>
    <marker id="ar-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="ar-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="60" y="30" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold">Model FBD · draw one diagram for EACH object</text>
  <line x1="250" y1="90" x2="480" y2="90" stroke="#334155" stroke-width="5"/>
  <circle cx="360" cy="90" r="24" fill="none" stroke="#334155" stroke-width="4"/>
  <line x1="338" y1="100" x2="338" y2="250" stroke="#0891b2" stroke-width="3"/>
  <line x1="382" y1="100" x2="382" y2="180" stroke="#0891b2" stroke-width="3"/>
  <rect x="308" y="250" width="60" height="60" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <text x="316" y="288" font-family="Arial, sans-serif" font-size="20" fill="#334155">3.0 kg</text>
  <rect x="360" y="180" width="50" height="50" fill="#fef3c7" stroke="#334155" stroke-width="3"/>
  <text x="366" y="212" font-family="Arial, sans-serif" font-size="18" fill="#334155">2.0 kg</text>
  <circle cx="590" cy="230" r="9" fill="#334155"/>
  <text x="540" y="180" font-family="Arial, sans-serif" font-size="22" fill="#334155">3.0 kg mass</text>
  <line x1="590" y1="230" x2="590" y2="370" stroke="#dc2626" stroke-width="6" marker-end="url(#ar-red)"/>
  <text x="605" y="360" font-family="Arial, sans-serif" font-size="22" fill="#dc2626">W = 29 N (longer)</text>
  <line x1="590" y1="230" x2="590" y2="120" stroke="#0891b2" stroke-width="6" marker-end="url(#ar-cyan)"/>
  <text x="605" y="135" font-family="Arial, sans-serif" font-size="22" fill="#0891b2">T</text>
  <circle cx="800" cy="230" r="9" fill="#334155"/>
  <text x="750" y="180" font-family="Arial, sans-serif" font-size="22" fill="#334155">2.0 kg mass</text>
  <line x1="800" y1="230" x2="800" y2="340" stroke="#dc2626" stroke-width="6" marker-end="url(#ar-red)"/>
  <text x="815" y="330" font-family="Arial, sans-serif" font-size="22" fill="#dc2626">W = 20 N</text>
  <line x1="800" y1="230" x2="800" y2="105" stroke="#0891b2" stroke-width="6" marker-end="url(#ar-cyan)"/>
  <text x="815" y="120" font-family="Arial, sans-serif" font-size="22" fill="#0891b2">T (longer)</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="22" fill="#334155">Same T in both diagrams (light string). 3.0 kg accelerates down; 2.0 kg accelerates up with the same a.</text>
</svg>
