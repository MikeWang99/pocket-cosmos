<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Reference free-body diagram: lower block of two stacked blocks moving at constant speed</title>
  <desc id="desc">Block A sits on block B; both move right at constant speed on rough ground. The free-body diagram of block B shows weight, ground normal reaction, contact force from A, and ground friction only.</desc>
  <defs>
    <marker id="ar-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="ar-ind" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4f46e5"/></marker>
    <marker id="ar-amb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ar-grn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="60" y="30" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold">Model FBD · forces on the lower block B only</text>
  <line x1="60" y1="250" x2="400" y2="250" stroke="#334155" stroke-width="4"/>
  <rect x="150" y="190" width="160" height="60" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <text x="215" y="228" font-family="Arial, sans-serif" font-size="24" fill="#334155">B</text>
  <rect x="180" y="140" width="100" height="50" fill="#fef3c7" stroke="#334155" stroke-width="3"/>
  <text x="220" y="172" font-family="Arial, sans-serif" font-size="24" fill="#334155">A</text>
  <line x1="330" y1="220" x2="390" y2="220" stroke="#16a34a" stroke-width="5" marker-end="url(#ar-grn)"/>
  <text x="345" y="205" font-family="Arial, sans-serif" font-size="20" fill="#15803d">v →</text>
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="20" fill="#334155">rough ground, constant speed</text>
  <line x1="470" y1="60" x2="470" y2="390" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="680" cy="215" r="10" fill="#334155"/>
  <text x="660" y="180" font-family="Arial, sans-serif" font-size="22" fill="#334155">B (dot)</text>
  <line x1="680" y1="215" x2="680" y2="330" stroke="#dc2626" stroke-width="6" marker-end="url(#ar-red)"/>
  <text x="695" y="320" font-family="Arial, sans-serif" font-size="24" fill="#dc2626">weight of B</text>
  <line x1="680" y1="215" x2="680" y2="75" stroke="#4f46e5" stroke-width="6" marker-end="url(#ar-ind)"/>
  <text x="695" y="95" font-family="Arial, sans-serif" font-size="24" fill="#4f46e5">N from ground (largest)</text>
  <line x1="620" y1="215" x2="620" y2="305" stroke="#16a34a" stroke-width="6" marker-end="url(#ar-grn)"/>
  <text x="480" y="295" font-family="Arial, sans-serif" font-size="22" fill="#15803d">contact force from A</text>
  <line x1="680" y1="240" x2="540" y2="240" stroke="#f59e0b" stroke-width="6" marker-end="url(#ar-amb)"/>
  <text x="500" y="268" font-family="Arial, sans-serif" font-size="22" fill="#b45309">friction from ground</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">Trap: NO friction between A and B — constant speed means block A needs no horizontal force.</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="22" fill="#334155">Vertical: N from ground = weight of B + contact force from A.</text>
</svg>
