<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Reference free-body diagram: skydiver just after opening the parachute</title>
  <desc id="desc">A skydiver falling downwards just after opening the parachute. Weight acts down and air resistance acts up, with air resistance much longer because the skydiver decelerates.</desc>
  <defs>
    <marker id="ar-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="ar-pur" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="ar-grn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="60" y="30" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold">Model FBD · just after the parachute opens (decelerating)</text>
  <path d="M150 150 Q240 70 330 150 Z" fill="#fef3c7" stroke="#334155" stroke-width="3"/>
  <line x1="170" y1="150" x2="230" y2="230" stroke="#334155" stroke-width="2"/>
  <line x1="310" y1="150" x2="250" y2="230" stroke="#334155" stroke-width="2"/>
  <circle cx="240" cy="245" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <line x1="240" y1="257" x2="240" y2="310" stroke="#334155" stroke-width="4"/>
  <line x1="240" y1="330" x2="240" y2="390" stroke="#16a34a" stroke-width="5" marker-end="url(#ar-grn)"/>
  <text x="255" y="380" font-family="Arial, sans-serif" font-size="22" fill="#15803d">v ↓ (still falling)</text>
  <circle cx="620" cy="250" r="10" fill="#334155"/>
  <text x="570" y="200" font-family="Arial, sans-serif" font-size="22" fill="#334155">skydiver (dot)</text>
  <line x1="620" y1="250" x2="620" y2="360" stroke="#dc2626" stroke-width="6" marker-end="url(#ar-red)"/>
  <text x="635" y="350" font-family="Arial, sans-serif" font-size="24" fill="#dc2626">W</text>
  <line x1="620" y1="250" x2="620" y2="90" stroke="#7c3aed" stroke-width="6" marker-end="url(#ar-pur)"/>
  <text x="635" y="110" font-family="Arial, sans-serif" font-size="24" fill="#7c3aed">air resistance (much longer)</text>
  <text x="480" y="395" font-family="Arial, sans-serif" font-size="22" fill="#334155">drag &gt; W ⇒ resultant force upwards ⇒ deceleration while still moving down.</text>
  <text x="480" y="425" font-family="Arial, sans-serif" font-size="22" fill="#334155">As speed falls, drag shrinks until drag = W (new terminal speed).</text>
</svg>
