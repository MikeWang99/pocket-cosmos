<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Tangential and centripetal acceleration components</title>
  <desc id="desc">At one point on a circular path, tangential and centripetal acceleration add to form total acceleration.</desc>
  <rect width="1000" height="700" fill="#ffffff"/>
  <circle cx="430" cy="390" r="250" fill="#f8fafc" stroke="#64748b" stroke-width="10" stroke-dasharray="18 14"/>
  <circle cx="430" cy="140" r="20" fill="#0f172a"/>
  <defs><marker id="v" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker><marker id="at" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#f97316"/></marker><marker id="ac" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dc2626"/></marker><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#7c3aed"/></marker></defs>
  <line x1="430" y1="140" x2="750" y2="140" stroke="#2563eb" stroke-width="12" marker-end="url(#v)"/>
  <line x1="430" y1="140" x2="650" y2="140" stroke="#f97316" stroke-width="18" marker-end="url(#at)" opacity=".78"/>
  <line x1="430" y1="140" x2="430" y2="355" stroke="#dc2626" stroke-width="14" marker-end="url(#ac)"/>
  <line x1="430" y1="140" x2="650" y2="355" stroke="#7c3aed" stroke-width="14" marker-end="url(#a)"/>
  <line x1="650" y1="140" x2="650" y2="355" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 10"/>
  <line x1="430" y1="355" x2="650" y2="355" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="770" y="154" font-family="Arial, sans-serif" font-size="42" fill="#1d4ed8">v</text>
  <text x="570" y="108" font-family="Arial, sans-serif" font-size="40" fill="#c2410c">a<tspan baseline-shift="sub" font-size="25">t</tspan></text>
  <text x="450" y="285" font-family="Arial, sans-serif" font-size="40" fill="#b91c1c">a<tspan baseline-shift="sub" font-size="25">c</tspan></text>
  <text x="655" y="375" font-family="Arial, sans-serif" font-size="44" fill="#6d28d9">a</text>
</svg>
