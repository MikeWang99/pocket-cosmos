<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Conical pendulum geometry and force components</title>
  <desc id="desc">A bob moves in a horizontal circle while tension has vertical and radial components.</desc>
  <rect width="1000" height="720" fill="#ffffff"/>
  <defs><marker id="tension" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#155E75"/></marker><marker id="weight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dc2626"/></marker><marker id="component" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#0891b2"/></marker></defs>
  <circle cx="500" cy="92" r="14" fill="#0f172a"/>
  <line x1="500" y1="92" x2="720" y2="445" stroke="#475569" stroke-width="10"/>
  <line x1="500" y1="92" x2="500" y2="445" stroke="#94a3b8" stroke-width="6" stroke-dasharray="14 12"/>
  <ellipse cx="500" cy="445" rx="300" ry="115" fill="#ecfeff" stroke="#0891b2" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="720" cy="445" r="34" fill="#f59e0b" stroke="#0f172a" stroke-width="7"/>
  <path d="M500 180 A90 90 0 0 1 548 168" fill="none" stroke="#f97316" stroke-width="8"/>
  <text x="548" y="174" font-family="Arial, sans-serif" font-size="42" fill="#c2410c">θ</text>
  <line x1="720" y1="445" x2="575" y2="210" stroke="#155E75" stroke-width="14" marker-end="url(#tension)"/>
  <line x1="720" y1="445" x2="720" y2="640" stroke="#dc2626" stroke-width="14" marker-end="url(#weight)"/>
  <line x1="720" y1="445" x2="535" y2="445" stroke="#0891b2" stroke-width="14" marker-end="url(#component)"/>
  <text x="590" y="270" font-family="Arial, sans-serif" font-size="44" fill="#3730a3">T</text>
  <text x="742" y="625" font-family="Arial, sans-serif" font-size="44" fill="#b91c1c">mg</text>
  <text x="555" y="425" font-family="Arial, sans-serif" font-size="38" fill="#0e7490">T sin θ</text>
  <text x="744" y="330" font-family="Arial, sans-serif" font-size="38" fill="#475569">T cos θ = mg</text>
</svg>
