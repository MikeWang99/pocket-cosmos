<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Real forces that produce inward acceleration</title>
  <desc id="desc">Tension turns a ball, static friction turns a car, and gravity turns a satellite.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <defs><marker id="inward" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dc2626"/></marker></defs>
  <g transform="translate(20 25)">
    <rect x="0" y="0" width="360" height="650" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <text x="180" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">String tension</text>
    <circle cx="180" cy="355" r="140" fill="none" stroke="#94a3b8" stroke-width="7" stroke-dasharray="14 12"/>
    <circle cx="285" cy="265" r="30" fill="#0ea5e9" stroke="#0f172a" stroke-width="6"/>
    <line x1="270" y1="278" x2="200" y2="338" stroke="#dc2626" stroke-width="12" marker-end="url(#inward)"/>
    <text x="242" y="330" font-family="Arial, sans-serif" font-size="36" fill="#b91c1c">T</text>
  </g>
  <g transform="translate(420 25)">
    <rect x="0" y="0" width="360" height="650" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <text x="180" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Static friction</text>
    <path d="M34 500 C100 260 250 250 330 500" fill="none" stroke="#475569" stroke-width="80"/>
    <g transform="translate(185 330) rotate(8)"><rect x="-62" y="-28" width="124" height="56" rx="12" fill="#f97316" stroke="#0f172a" stroke-width="7"/><circle cx="-38" cy="34" r="11"/><circle cx="38" cy="34" r="11"/></g>
    <line x1="185" y1="350" x2="185" y2="455" stroke="#dc2626" stroke-width="12" marker-end="url(#inward)"/>
    <text x="205" y="426" font-family="Arial, sans-serif" font-size="34" fill="#b91c1c">f<tspan baseline-shift="sub" font-size="23">s</tspan></text>
  </g>
  <g transform="translate(820 25)">
    <rect x="0" y="0" width="360" height="650" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <text x="180" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Gravity</text>
    <circle cx="180" cy="350" r="72" fill="#22c55e" stroke="#166534" stroke-width="7"/>
    <ellipse cx="180" cy="350" rx="145" ry="220" fill="none" stroke="#4f46e5" stroke-width="7"/>
    <circle cx="180" cy="130" r="25" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
    <line x1="180" y1="160" x2="180" y2="255" stroke="#dc2626" stroke-width="12" marker-end="url(#inward)"/>
    <text x="205" y="220" font-family="Arial, sans-serif" font-size="34" fill="#b91c1c">F<tspan baseline-shift="sub" font-size="23">g</tspan></text>
  </g>
</svg>
