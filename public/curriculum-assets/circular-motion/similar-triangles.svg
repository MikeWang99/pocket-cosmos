<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Similar position and velocity triangles</title>
  <desc id="desc">The radius vectors and velocity vectors rotate through the same small angle.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="180" y="72" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Position vectors</text>
  <text x="755" y="72" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Velocity vectors</text>
  <g transform="translate(80 105)">
    <path d="M260 455 L260 65 L470 125 Z" fill="#eef2ff" stroke="#4f46e5" stroke-width="12" stroke-linejoin="round"/>
    <path d="M260 455 A88 88 0 0 1 284 372" fill="none" stroke="#f97316" stroke-width="8"/>
    <text x="282" y="398" font-family="Arial, sans-serif" font-size="42" fill="#c2410c">Δθ</text>
    <text x="210" y="270" font-family="Arial, sans-serif" font-size="42" fill="#3730a3">r</text>
    <text x="382" y="298" font-family="Arial, sans-serif" font-size="42" fill="#3730a3">r</text>
    <text x="332" y="76" font-family="Arial, sans-serif" font-size="42" fill="#3730a3">Δr</text>
  </g>
  <g transform="translate(670 105)">
    <path d="M95 455 L95 65 L305 125 Z" fill="#ecfeff" stroke="#0891b2" stroke-width="12" stroke-linejoin="round"/>
    <path d="M95 455 A88 88 0 0 1 119 372" fill="none" stroke="#f97316" stroke-width="8"/>
    <text x="117" y="398" font-family="Arial, sans-serif" font-size="42" fill="#c2410c">Δθ</text>
    <text x="42" y="270" font-family="Arial, sans-serif" font-size="42" fill="#0e7490">v</text>
    <text x="214" y="298" font-family="Arial, sans-serif" font-size="42" fill="#0e7490">v</text>
    <text x="157" y="76" font-family="Arial, sans-serif" font-size="42" fill="#0e7490">Δv</text>
  </g>
</svg>
